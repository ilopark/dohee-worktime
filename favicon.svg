  <rect x="19.9" y="4" width="2.6" height="5.5" rx="1.3" fill="#ffffff"/>
  <rect x="5.5" y="7.5" width="21" height="19.5" rx="3.5" fill="#ffffff"/>
  <rect x="9"    y="12.5" width="5.5" height="4.6" rx="1.3" fill="#e5484d"/>
  <rect x="17.5" y="12.5" width="5.5" height="4.6" rx="1.3" fill="#cfd9ea"/>
  <rect x="9"    y="19"   width="5.5" height="4.6" rx="1.3" fill="#cfd9ea"/>
  <rect x="17.5" y="19"   width="5.5" height="4.6" rx="1.3" fill="#b25a00"/>
</svg>
